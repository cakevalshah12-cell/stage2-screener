name: Weekly Stage 2 scan

on:
  schedule:
    - cron: "30 2 * * 6"   # every Saturday 02:30 UTC = 08:00 IST
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run screener on all NSE stocks
        env:
          TZ: Asia/Kolkata
        run: |
          DATE=$(date +%F)
          mkdir -p results docs/data/history
          python stage2_screener.py --universe all \
            --out "results/stage2_${DATE}.xlsx" \
            --json-out docs/data/latest.json
          cp docs/data/latest.json "docs/data/history/${DATE}.json"

      - name: Save results
        run: |
          git config user.name "stage2-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs/data lists
          git commit -m "Weekly scan $(date +%F)" || echo "No changes"
          git push
